<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · WattWise AI</title>
<style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,sans-serif;background:linear-gradient(180deg,#C6E2FF,#F5F9FF);min-height:100vh;display:grid;place-items:center;color:#122448;padding:16px}.c{background:#fff;border:1px solid #DFE8F3;border-radius:20px;padding:30px;width:min(400px,100%);box-shadow:0 24px 60px rgba(11,31,77,.12)}h1{font-size:24px;color:#0B1F4D;margin-bottom:6px}p{color:#63748D;font-size:14px;margin-bottom:18px}label{display:block;font-size:13px;font-weight:600;margin-bottom:14px}input{width:100%;margin-top:6px;padding:12px;border:1px solid #DFE8F3;border-radius:10px;font:inherit}button{width:100%;padding:13px;border-radius:10px;border:1.5px solid #0866E8;background:#0866E8;color:#fff;font:600 15px system-ui;cursor:pointer;margin-top:4px}button.o{background:#fff;color:#0866E8}#m{font-size:13px;margin-top:12px;min-height:18px}a{color:#0866E8;font-size:13px}</style></head><body>
<div class="c"><h1>WattWise <span style="color:#1687FF">AI</span></h1><p>Sign in to save your devices, settings and history.</p>
<label>Email<input id="e" type="email" autocomplete="email"></label><label>Password (min 8)<input id="p" type="password" autocomplete="current-password"></label>
<button id="in">Sign in</button><button class="o" id="up">Create account</button><div id="m" role="status"></div><a href="/">← Back to website</a></div>
<script src="/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>const m=document.getElementById('m'),v=i=>document.getElementById(i).value.trim();
if(!window.ENV||!ENV.url){m.style.color='#DC4545';m.textContent='Supabase is not configured yet. Set the environment variables (see README).'}else{const sb=supabase.createClient(ENV.url,ENV.key);
const run=async up=>{const e=v('e'),p=v('p');if(!/^\S+@\S+\.\S+$/.test(e)||p.length<8){m.style.color='#DC4545';m.textContent='Enter a valid email and a password of at least 8 characters.';return}
const r=up?await sb.auth.signUp({email:e,password:p}):await sb.auth.signInWithPassword({email:e,password:p});if(r.error){m.style.color='#DC4545';m.textContent=r.error.message;return}
if(up&&!r.data.session){m.style.color='#0E8A5F';m.textContent='Account created. Check your email to confirm, then sign in.';return}location.href='/#app'};
document.getElementById('in').onclick=()=>run(0);document.getElementById('up').onclick=()=>run(1)}</script></body></html>
